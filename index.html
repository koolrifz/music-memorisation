<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note Name Quiz</title>
  <style>
    body {
      background-color: #121f2d;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Top Clef Selector Menu */
    .clef-selector {
      display: flex;
      justify-content: space-between;
      background: #1e2d3d;
      padding: 4px;
      border-radius: 12px;
      gap: 4px;
    }

    .clef-btn {
      flex: 1;
      padding: 8px 0;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .clef-btn.active {
      background: #0284c7;
      color: #ffffff;
    }

    /* Helper Sheet Styles */
    .helper-card {
      background: #ffffff;
      color: #000000;
      border-radius: 16px;
      padding: 8px 12px;
    }

    .helper-staff-container {
      padding: 0 12px;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .helper-title {
      color: #333;
      font-size: 0.8rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 4px;
    }

    /* Main Quiz Staff Box */
    .quiz-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Piano Keyboard Styles */
    .keyboard-wrapper {
      width: 100%;
      background: #1e2d3d;
      padding: 10px 6px;
      border-radius: 12px;
      box-sizing: border-box;
    }

    .keyboard {
      position: relative;
      display: flex;
      height: 150px;
      width: 100%;
      user-select: none;
      touch-action: manipulation;
    }

    .white-key {
      flex: 1;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-bottom-left-radius: 6px;
      border-bottom-right-radius: 6px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 10px;
      color: #0f172a;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      z-index: 1;
      box-shadow: inset 0 -4px 0 #cbd5e1;
    }

    .white-key:active, .white-key.pressed {
      background: #e2e8f0;
      box-shadow: inset 0 -1px 0 #94a3b8;
      transform: translateY(2px);
    }

    /* Non-blocking Black Keys */
    .black-key {
      position: absolute;
      top: 0;
      width: 8.2%;
      height: 58%;
      background: #1e293b;
      border-bottom-left-radius: 4px;
      border-bottom-right-radius: 4px;
      z-index: 2;
      pointer-events: none; /* Allows clicks to pass through to white keys underneath */
      box-shadow: 2px 2px 4px rgba(0,0,0,0.4);
    }

    .toggle-btn {
      background: #334155;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 0.75rem;
      align-self: center;
    }
  </style>
</head>
<body>

<div class="app-container">
  
  <!-- Clef Selection Menu -->
  <div class="clef-selector">
    <button class="clef-btn active" onclick="selectClef('treble')">Treble</button>
    <button class="clef-btn" onclick="selectClef('bass')">Bass</button>
    <button class="clef-btn" onclick="selectClef('alto')">Alto</button>
    <button class="clef-btn" onclick="selectClef('tenor')">Tenor</button>
  </div>

  <button class="toggle-btn" onclick="toggleInterface()">Toggle Input: Keyboard / Circle</button>

  <!-- Helper Sheet -->
  <div class="helper-card">
    <div class="helper-title" id="helper-title">Treble Clef Helpers</div>
    <div class="helper-staff-container" id="helper-display">
      <div id="helper-lines-text" style="font-size: 0.75rem; color: #444;"></div>
      <div id="helper-spaces-text" style="font-size: 0.75rem; color: #444;"></div>
    </div>
  </div>

  <!-- Main Staff Box (No Centre Bar Line) -->
  <div class="quiz-card">
    <svg id="main-staff" width="300" height="100" viewBox="0 0 300 100">
      <line x1="10" y1="20" x2="290" y2="20" stroke="#000" stroke-width="1.5"/>
      <line x1="10" y1="35" x2="290" y2="35" stroke="#000" stroke-width="1.5"/>
      <line x1="10" y1="50" x2="290" y2="50" stroke="#000" stroke-width="1.5"/>
      <line x1="10" y1="65" x2="290" y2="65" stroke="#000" stroke-width="1.5"/>
      <line x1="10" y1="80" x2="290" y2="80" stroke="#000" stroke-width="1.5"/>

      <!-- Dynamic Clef Symbol -->
      <text id="clef-symbol" x="15" y="72" font-family="Bravura, Academico, serif" font-size="48">𝄞</text>

      <!-- Whole Note -->
      <ellipse cx="150" cy="80" rx="8" ry="5.5" fill="none" stroke="#000" stroke-width="3" transform="rotate(-15 150 80)"/>
    </svg>
  </div>

  <!-- Input Interface Container -->
  <div id="interface-container"></div>
</div>

<script>
  let activeClef = 'treble';
  let currentInterface = 'keyboard';

  const clefSymbols = {
    treble: '𝄞',
    bass: '𝄢',
    alto: '𝄡',
    tenor: '𝄡'
  };

  const helperData = {
    treble: {
      lines: "Lines: Every Good Boy Deserves Fruit",
      spaces: "Spaces: F A C E"
    },
    bass: {
      lines: "Lines: Good Boys Deserve Fruit Always",
      spaces: "Spaces: All Cows Eat Grass"
    },
    alto: {
      lines: "Lines: Fat Alley Cats Eat Garbage",
      spaces: "Spaces: Good Boys Deserve Fruit"
    },
    tenor: {
      lines: "Lines: Dogs Face A Cat's Eye",
      spaces: "Spaces: Empty Garbage Before Dinner"
    }
  };

  function selectClef(clef) {
    activeClef = clef;
    
    // Update active button styling
    document.querySelectorAll('.clef-btn').forEach(btn => {
      btn.classList.toggle('active', btn.innerText.toLowerCase() === clef);
    });

    // Update Clef Symbol on main staff
    document.getElementById('clef-symbol').textContent = clefSymbols[clef];

    // Update Helper Sheet
    document.getElementById('helper-title').textContent = `${clef.charAt(0).toUpperCase() + clef.slice(1)} Clef Helpers`;
    document.getElementById('helper-lines-text').textContent = helperData[clef].lines;
    document.getElementById('helper-spaces-text').textContent = helperData[clef].spaces;
  }

  function handleNoteSelection(note) {
    alert(`Selected Note: ${note}`);
    // Connect to scoring / answer validation logic here
  }

  function renderKeyboardInterface() {
    const container = document.getElementById('interface-container');
    const whiteKeys = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'A'];
    
    // Position black key overlays accurately between keys
    const blackKeyPositions = [8.2, 33.2, 45.7, 70.7, 83.2];

    let html = `
      <div class="keyboard-wrapper">
        <div class="keyboard">
    `;

    whiteKeys.forEach((note) => {
      html += `<div class="white-key" onclick="handleNoteSelection('${note}')">${note}</div>`;
    });

    blackKeyPositions.forEach((pos) => {
      html += `<div class="black-key" style="left: ${pos}%;"></div>`;
    });

    html += `
        </div>
      </div>
    `;

    container.innerHTML = html;
  }

  function renderCircleInterface() {
    const container = document.getElementById('interface-container');
    container.innerHTML = `<div style="color: #aaa; text-align: center; padding: 20px;">[ Circle Interface Active ]</div>`;
  }

  function updateInterface() {
    if (currentInterface === 'keyboard') {
      renderKeyboardInterface();
    } else {
      renderCircleInterface();
    }
  }

  function toggleInterface() {
    currentInterface = (currentInterface === 'keyboard') ? 'circle' : 'keyboard';
    updateInterface();
  }

  // Initial Load
  selectClef('treble');
  updateInterface();
</script>

</body>
</html>
