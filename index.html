<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=portrait">
    <title>Kool Riffs - Music Mastery</title>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@3.0.9/releases/vexflow-min.js"></script>
    <style>
        :root {
            /* Shared Theme Colors */
            --bg-dark: #1a2634;
            --bg-panel: #243447;
            --accent-green: #58cc02;
            --accent-green-shadow: #46a302;
            --accent-blue: #1cb0f6;
            --accent-blue-shadow: #1485bc;
            --accent-purple: #ce82ff;
            --accent-purple-shadow: #a85be0;
            --accent-red: #ff4b4b;
            --accent-red-shadow: #d82b2b;
            --accent-gold: #ffc800;
            --text-main: #ffffff;
            --text-muted: #8696a7;
        }

        /* --- GLOBAL BASE --- */
        body {
            font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- SPA VIEW MANAGEMENT (KOOL RIFFS SHELL) --- */
        .view {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
            overflow-y: auto;
        }
        .view.active {
            display: flex;
            opacity: 1;
            z-index: 10;
        }

        /* --- DASHBOARD UI --- */
        .header { text-align: center; margin-bottom: 30px; margin-top: 20px; }
        .header h1 { font-size: 36px; margin: 0; color: var(--accent-gold); text-shadow: 0 2px 4px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; gap: 10px; }
        .header p { color: var(--text-muted); margin: 5px 0 0 0; font-size: 16px; font-weight: bold; }
        .menu-container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 16px; }

        .game-card { background: var(--bg-panel); border: 3px solid #324a64; border-radius: 20px; padding: 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.4); transition: transform 0.1s, border-color 0.1s; }
        .game-card:active { transform: scale(0.97); }
        .game-card.purple:active { border-color: var(--accent-purple); }
        .game-card.blue:active { border-color: var(--accent-blue); }
        .game-card.green:active { border-color: var(--accent-green); }

        .game-icon { width: 60px; height: 60px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; font-weight: 900; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
        .icon-purple { background: var(--accent-purple); }
        .icon-blue { background: var(--accent-blue); }
        .icon-green { background: var(--accent-green); }

        .game-details h2 { margin: 0 0 4px 0; font-size: 20px; color: white; }
        .game-details p { margin: 0; font-size: 14px; color: var(--text-muted); line-height: 1.3; }

        /* --- FOOTER & MODAL --- */
        .footer { margin-top: auto; padding: 20px 0; text-align: center; }
        .btn-text { background: none; border: none; color: var(--text-muted); font-size: 14px; font-weight: bold; cursor: pointer; text-decoration: underline; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 100; opacity: 0; transition: opacity 0.2s; }
        .modal-overlay.show { display: flex; opacity: 1; }
        .credits-box { background: var(--bg-panel); padding: 30px; border-radius: 24px; max-width: 320px; text-align: center; border: 3px solid #324a64; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .credits-box h3 { margin: 0 0 10px 0; color: var(--accent-gold); }
        .credits-box p { color: var(--text-main); font-size: 15px; margin-bottom: 20px; }
        .btn-close { background: var(--accent-blue); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 4px 0 var(--accent-blue-shadow); }
        .btn-close:active { transform: translateY(4px); box-shadow: 0 0 0; }

        .game-nav { position: absolute; top: 15px; left: 15px; z-index: 50; }
        .btn-back { background: #324a64; color: white; border: none; padding: 8px 16px; border-radius: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: background 0.1s; }
        .btn-back:active { background: #243447; transform: translateY(2px); }

        /* --- NOTEQUEST INTERNAL SCREENS --- */
        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 12px; box-sizing: border-box; position: absolute; top: 0; left: 0; pointer-events: none; opacity: 0; transition: opacity 0.15s ease-in-out; }
        .screen.active { display: flex; pointer-events: auto; opacity: 1; z-index: 10; }
        
        .setup-card { background: var(--bg-panel); padding: 24px; border-radius: 24px; width: 100%; max-width: 440px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 3px solid #324a64; z-index: 20; position: relative; }
        .setup-card h1 { margin: 0 0 6px 0; font-size: 28px; color: var(--accent-gold); text-shadow: 0 2px 0 rgba(0,0,0,0.3); }
        
        select { width: 100%; padding: 14px; margin-bottom: 14px; background: #1a2634; color: white; border: 3px solid #324a64; border-radius: 16px; font-size: 16px; font-weight: bold; outline: none; }
        .btn { width: 100%; padding: 16px; font-size: 18px; font-weight: 800; border-radius: 18px; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; color: white; transition: transform 0.1s; touch-action: manipulation; position: relative; z-index: 30; }
        .btn-start { background: var(--accent-green); box-shadow: 0 6px 0 var(--accent-green-shadow); margin-top: 10px; }
        .btn-start:active { transform: translateY(6px); box-shadow: 0 0 0 var(--accent-green-shadow); }
