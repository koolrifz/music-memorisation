<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music Memorisation Engine - Gamified</title>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@3.0.9/releases/vexflow-min.js"></script>
    <style>
        :root {
            --bg-dark: #131f24;
            --bg-panel: #202f36;
            --accent-green: #58cc02;
            --accent-green-shadow: #58a700;
            --accent-red: #ff4b4b;
            --accent-red-shadow: #ea2b2b;
            --accent-blue: #1cb0f6;
            --accent-blue-shadow: #1899d6;
            --text-main: #ffffff;
            --text-muted: #afbac0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none; 
            -webkit-tap-highlight-color: transparent;
        }

        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 20px; box-sizing: border-box; }
        .screen.active { display: flex; }

        .setup-card { background: var(--bg-panel); padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; }
        .setup-card h1 { margin: 0 0 8px 0; font-size: 22px; color: var(--accent-blue); }
        .setup-card p { margin: 0 0 20px 0; font-size: 14px; color: var(--text-muted); }
        
        select { width: 100%; padding: 12px; margin-bottom: 12px; background: var(--bg-dark); color: white; border: 2px solid #37464f; border-radius: 12px; font-size: 16px; font-weight: bold; outline: none; }

        .btn { width: 100%; padding: 16px; font-size: 18px; font-weight: bold; border-radius: 16px; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; color: white; transition: transform 0.1s; touch-action: manipulation; }
        .btn-start { background: var(--accent-green); box-shadow: 0 4px 0 var(--accent-green-shadow); margin-top: 10px; }
        .btn-start:active { transform: translateY(4px); box-shadow: 0 0 0 var(--accent-green-shadow); }

        .btn-secondary { background: #37464f; box-shadow: 0 4px 0 #263138; margin-top: 10px; font-size: 15px; padding: 12px; }
        .btn-secondary:active { transform: translateY(4px); box-shadow: 0 0 0 #263138; }
        
        #error-box { color: #ff4b4b; background: rgba(255,0,0,0.1); padding: 10px; margin-top: 15px; border-radius: 8px; font-size: 14px; display: none; font-weight: bold;}

        /* Game Screen Elements */
        .game-header { width: 100%; max-width: 500px; display: flex; align-items: center; gap: 15px; margin-bottom: 20px; margin-top: 20px; }
        .progress-bar-container { flex: 1; height: 16px; background: #37464f; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent-green); width: 0%; border-radius: 10px; transition: width 0.3s ease-out; }
        .streak-counter { font-size: 18px; font-weight: bold; color: #ff9600; display: flex; align-items: center; gap: 4px; }
        .timer-badge { font-size: 14px; font-weight: bold; color: var(--accent-blue); transition: color 0.3s; }

        .card-wrapper { width: 100%; max-width: 500px; background: #ffffff; border-radius: 16px; padding: 15px 0; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; min-height: 130px; position: relative; }
        .fade-out svg { opacity: 0; transition: opacity 0.8s ease-in-out; }
        .fade-in svg { opacity: 1; transition: opacity 0.2s ease-in-out; }

        .inputs-row { display: flex; width: 100%; max-width: 500px; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: auto; }
        .input-cell input { width: 40px; height: 48px; text-align: center; font-size: 22px; font-weight: bold; text-transform: uppercase; border: 2px solid #37464f; border-radius: 12px; background: var(--bg-panel); color: white; transition: all 0.15s; }
        .input-cell input.active-box { border-color: var(--accent-blue); background: rgba(28, 176, 246, 0.1); transform: scale(1.05); }
        .input-cell input.correct { background-color: var(--accent-green); border-color: var(--accent-green-shadow); color: white; animation: pop 0.3s ease-out; }
        .input-cell input.incorrect { background-color: var(--accent-red); border-color: var(--accent-red-shadow); color: white; animation: shake 0.4s; }

        #note-keypad { width: 100%; max-width: 500px; background: var(--bg-dark); padding: 10px 0; padding-bottom: env(safe-area-inset-bottom, 20px); display: flex; justify-content: space-between; gap: 6px; }
        .keypad-btn { background: var(--bg-panel); color: white; font-size: 20px; font-weight: bold; border: none; border-bottom: 4px solid #141e22; border-radius: 12px; flex: 1; height: 56px; cursor: pointer; touch-action: manipulation; }
        .keypad-btn:active { border-bottom-width: 0px; transform: translateY(4px); background: var(--accent-blue); }
        .keypad-btn.del-btn { background: #37464f; border-bottom-color: #263138; font-size: 16px; max-width: 50px; }

        .summary-card { background: var(--bg-panel); padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; }
        .summary-card h2 { color: #ffc800; font-size: 28px; margin: 0 0 10px 0; }
        .summary-stat { font-size: 18px; margin-bottom: 15px; color: var(--text-muted); }

        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
    </style>
</head>
<body>

<div id="screen-setup" class="screen active">
    <div class="setup-card">
        <h1>Music Memorisation</h1>
        <p>Master your sight-reading speed.</p>
        
        <select id="clef-select">
            <option value="treble">Treble Clef</option>
            <option value="bass">Bass Clef</option>
            <option value="alto">Alto Clef</option>
            <option value="tenor">Tenor Clef</option>
        </select>
        
        <select id="level-select">
            <option value="1">Level 1: Whole Notes</option>
            <option value="2">Level 2: Rhythms</option>
        </select>
        
        <select id="memory-mode">
            <option value="visible">Mode: Always Visible</option>
            <option value="fade-5">Mode: Memory (5s Fade)</option>
            <option value="fade-2">Mode: Blitz (2s Fade)</option>
        </select>
        
        <button class="btn btn-start" id="start-btn">Start Round</button>
        <div id="error-box"></div>
    </div>
</div>

<div id="screen-game" class="screen">
    <div class="game-header">
        <div class="progress-bar-container"><div class="progress-fill" id="progress-bar"></div></div>
        <div class="streak-counter">🔥 <span id="streak-text">0</span></div>
    </div>
    <div class="timer-badge" id="timer-badge">Stay focused!</div>
    <div class="card-wrapper fade-in" id="card-canvas-wrapper"><div id="score-canvas"></div></div>
    <div class="inputs-row" id="inputs-container"></div>
    <div id="note-keypad">
        <button class="keypad-btn" data-key="A">A</button>
        <button class="keypad-btn" data-key="B">B</button>
        <button class="keypad-btn" data-key="C">C</button>
        <button class="keypad-btn" data-key="D">D</button>
        <button class="keypad-btn" data-key="E">E</button>
        <button class="keypad-btn" data-key="F">F</button>
        <button class="keypad-btn" data-key="G">G</button>
        <button class="keypad-btn del-btn" id="del-btn">⌫</button>
    </div>
</div>

<div id="screen-summary" class="screen">
    <div class="summary-card">
        <h2>Round Complete!</h2>
        <div class="summary-stat">Accuracy: <span id="final-accuracy" style="color:white; font-weight:bold;">100%</span></div>
        <div class="summary-stat">Max Streak: 🔥 <span id="final-streak" style="color:#ff9600; font-weight:bold;">0</span></div>
        <button class="btn btn-start" id="restart-btn">Play Again</button>
        <button class="btn btn-secondary" id="setup-btn">Change Settings</button>
    </div>
</div>

<script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
        const errBox = document.getElementById('error-box');
        errBox.style.display = 'block';
        errBox.innerText = `System Error: ${msg} (Line ${lineNo})`;
        return false;
    };

    document.addEventListener('DOMContentLoaded', () => {
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const setupBtn = document.getElementById('setup-btn');

        ['click', 'touchend'].forEach(evt => {
            startBtn.addEventListener(evt, (e) => { e.preventDefault(); startGame(); });
            restartBtn.addEventListener(evt, (e) => { e.preventDefault(); startGame(); });
            setupBtn.addEventListener(evt, (e) => { e.preventDefault(); switchScreen('screen-setup'); });
        });

        document.querySelectorAll('.keypad-btn[data-key]').forEach(btn => {
            ['click', 'touchend'].forEach(evt => {
                btn.addEventListener(evt, (e) => { e.preventDefault(); handleKeypadInput(btn.getAttribute('data-key')); });
            });
        });

        const delBtn = document.getElementById('del-btn');
        ['click', 'touchend'].forEach(evt => {
            delBtn.addEventListener(evt, (e) => { e.preventDefault(); handleKeypadDelete(); });
        });
    });

    let audioCtx = null;
    function initAudio() {
        try {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        } catch (e) { console.warn("Audio blocked.", e); }
    }

    function playSound(type) {
        if (!audioCtx) return;
        try {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1); gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2); gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2); osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'timeout') {
                osc.type = 'square'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5); gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5); osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'complete') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(440, audioCtx.currentTime); osc.frequency.setValueAtTime(554, audioCtx.currentTime + 0.15); osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.3); gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8); osc.start(); osc.stop(audioCtx.currentTime + 0.8);
            }
        } catch (e) { console.warn("Could not play sound.", e); }
    }

    const LEVEL_2_PATTERNS = [ [ {dur: "q"}, {dur: "q"}, {dur: "q"}, {dur: "q"} ], [ {dur: "h"}, {dur: "h"} ], [ {dur: "h"}, {dur: "q"}, {dur: "q"} ], [ {dur: "q"}, {dur: "q"}, {dur: "h"} ], [ {dur: "w"} ] ];
    
    const CLEF_CONFIGS = {
        "treble": { clef: "treble", lines: [["E","e/4"],["G","g/4"],["B","b/4"],["D","d/5"],["F","f/5"]], spaces: [["F","f/4"],["A","a/4"],["C","c/5"],["E","e/5"]] },
        "bass":   { clef: "bass",   lines: [["G","g/2"],["B","b/2"],["D","d/3"],["F","f/3"],["A","a/3"]], spaces: [["A","a/2"],["C","c/3"],["E","e/3"],["G","g/3"]] },
        "alto":   { clef: "alto",   lines: [["F","f/3"],["A","a/3"],["C","c/4"],["E","e/4"],["G","g/4"]] , spaces: [["G","g/3"],["B","b/3"],["D","d/4"],["F","f/4"]] },
        "tenor":  { clef: "tenor",  lines: [["D","d/3"],["F","f/3"],["A","a/3"],["C","c/4"],["E","e/4"]], spaces: [["E","e/3"],["G","g/3"],["B","b/3"],["D","d/4"]] }
    };

    const TOTAL_CARDS_PER_ROUND = 5;
    let currentCardIndex = 0, activeInputIndex = 0, currentStreak = 0, maxStreak = 0, totalNotesAttempted = 0, correctNotesFirstTry = 0;
    let currentExpectedNotes = [];
    let currentNoteHasErrored = false;
    let fadeTimer = null;
    let recallTimer = null;

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function startGame() {
        try {
            const errBox = document.getElementById('error-box'); 
            errBox.style.display = 'none';
            
            if (typeof Vex === 'undefined') {
                errBox.style.display = 'block'; 
                errBox.innerHTML = "❌ <b>VexFlow Blocked!</b> Active internet connection required to load VexFlow."; 
                return;
            }
            
            initAudio(); 
            currentCardIndex = 0; currentStreak = 0; maxStreak = 0; totalNotesAttempted = 0; correctNotesFirstTry = 0;
            updateProgressUI(); 
            switchScreen('screen-game'); 
            loadNextCard();
        } catch (err) {
            const errBox = document.getElementById('error-box');
            errBox.style.display = 'block';
            errBox.innerText = `Failed to start: ${err.message}`;
        }
    }

    function updateProgressUI() {
        document.getElementById('progress-bar').style.width = `${(currentCardIndex / TOTAL_CARDS_PER_ROUND) * 100}%`;
        document.getElementById('streak-text').innerText = currentStreak;
    }

    function loadNextCard() {
        if (currentCardIndex >= TOTAL_CARDS_PER_ROUND) { finishRound(); return; }
        if (fadeTimer) clearTimeout(fadeTimer);
        if (recallTimer) clearTimeout(recallTimer);
        
        document.getElementById('card-canvas-wrapper').className = 'card-wrapper fade-in';
        document.getElementById('timer-badge').style.color = "var(--accent-blue)";
        generateFlashcard();
    }

    function generateFlashcard() {
        try {
            const VF = Vex.Flow;
            const canvasContainer = document.getElementById('score-canvas'); canvasContainer.innerHTML = '';
            const inputsContainer = document.getElementById('inputs-container'); inputsContainer.innerHTML = '';
            
            const level = document.getElementById('level-select').value;
            const config = CLEF_CONFIGS[document.getElementById('clef-select').value];
            const combinedPool = [...config.lines, ...config.spaces];

            const renderer = new VF.Renderer(canvasContainer, VF.Renderer.Backends.SVG); renderer.resize(320, 100);
            const context = renderer.getContext();
            const stave = new VF.Stave(0, 5, 320);
            stave.addClef(config.clef);
            if(level === '2') stave.addTimeSignature("4/4");
            stave.setContext(context).draw();

            currentExpectedNotes = []; let staveNotes = []; let lastPitchKey = null;

            if (level === '1') {
                let avail = combinedPool.filter(p => p[1] !== lastPitchKey);
                let chosen = avail[Math.floor(Math.random() * avail.length)];
                staveNotes.push(new VF.StaveNote({ clef: config.clef, keys: [chosen[1]], duration: "w" })); currentExpectedNotes.push(chosen[0]);
            } else {
                let pattern = LEVEL_2_PATTERNS[Math.floor(Math.random() * LEVEL_2_PATTERNS.length)];
                for (let item of pattern) {
                    let avail = combinedPool.filter(p => p[1] !== lastPitchKey);
                    let chosen = avail[Math.floor(Math.random() * avail.length)]; lastPitchKey = chosen[1];
                    staveNotes.push(new VF.StaveNote({ clef: config.clef, keys: [chosen[1]], duration: item.dur })); currentExpectedNotes.push(chosen[0]);
                }
            }

            let voice = new VF.Voice({ num_beats: 4, beat_value: 4 }).addTickables(staveNotes);
            new VF.Formatter().joinVoices([voice]).format([voice], 250);
            voice.draw(context, stave);

            currentExpectedNotes.forEach((_, idx) => {
                const cell = document.createElement('div'); cell.className = 'input-cell';
                const input = document.createElement('input'); input.type = 'text'; input.readOnly = true; input.id = `box-${idx}`;
                input.addEventListener('click', () => setActiveBox(idx));
                cell.appendChild(input); inputsContainer.appendChild(cell);
            });

            activeInputIndex = 0; currentNoteHasErrored = false; setActiveBox(0);

            const mode = document.getElementById('memory-mode').value;
            if (mode === 'fade-5') {
                startFadeCountdown(5);
            } else if (mode === 'fade-2') {
                startFadeCountdown(2);
            } else {
                startRecallCountdown(12, true); 
            }
        } catch (err) { 
            console.error("Render Error:", err.message); 
            document.getElementById('timer-badge').innerText = "Render Error: " + err.message;
        }
    }

    function startFadeCountdown(seconds) {
        let timeLeft = seconds;
        document.getElementById('timer-badge').innerText = `Memorise! Fading in ${timeLeft}s`;
        fadeTimer = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) { document.getElementById('timer-badge').innerText = `Memorise! Fading in ${timeLeft}s`; } 
            else {
                clearInterval(fadeTimer);
                document.getElementById('card-canvas-wrapper').className = 'card-wrapper fade-out';
                startRecallCountdown(6, false); 
            }
        }, 1000);
    }

    function startRecallCountdown(seconds, isVisible) {
        let timeLeft = seconds;
        document.getElementById('timer-badge').innerText = isVisible ? `Hurry! ${timeLeft}s left` : `Recall! ${timeLeft}s left`;
        
        recallTimer = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                document.getElementById('timer-badge').innerText = isVisible ? `Hurry! ${timeLeft}s left` : `Recall! ${timeLeft}s left`;
            } else {
                clearInterval(recallTimer);
                handleTimeOut();
            }
        }, 1000);
    }

    function handleTimeOut() {
        playSound('timeout');
        document.getElementById('timer-badge').innerText = "Time's up! Let's keep moving!";
        document.getElementById('timer-badge').style.color = "var(--accent-red)";
        
        document.querySelectorAl
