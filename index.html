<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=portrait">
    <title>Note Quest - SRS & Keyboard</title>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@3.0.9/releases/vexflow-min.js"></script>
    <style>
        :root {
            --bg-dark: #1a2634;
            --bg-panel: #243447;
            --accent-green: #58cc02;
            --accent-green-shadow: #46a302;
            --accent-red: #ff4b4b;
            --accent-red-shadow: #d82b2b;
            --accent-blue: #1cb0f6;
            --accent-gold: #ffc800;
            --text-main: #ffffff;
            --text-muted: #8696a7;
        }

        body { font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 12px; box-sizing: border-box; position: absolute; top: 0; left: 0; pointer-events: none; opacity: 0; transition: opacity 0.15s ease-in-out; }
        .screen.active { display: flex; pointer-events: auto; opacity: 1; z-index: 10; }
        
        .setup-card { background: var(--bg-panel); padding: 24px; border-radius: 24px; width: 100%; max-width: 440px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 3px solid #324a64; z-index: 20; position: relative; }
        .setup-card h1 { margin: 0 0 6px 0; font-size: 28px; color: var(--accent-gold); text-shadow: 0 2px 0 rgba(0,0,0,0.3); }
        .setup-card p { margin: 0 0 20px 0; font-size: 15px; color: var(--text-muted); }
        
        select { width: 100%; padding: 14px; margin-bottom: 14px; background: #1a2634; color: white; border: 3px solid #324a64; border-radius: 16px; font-size: 16px; font-weight: bold; outline: none; }
        .btn { width: 100%; padding: 16px; font-size: 18px; font-weight: 800; border-radius: 18px; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; color: white; transition: transform 0.1s; touch-action: manipulation; position: relative; z-index: 30; }
        .btn-start { background: var(--accent-green); box-shadow: 0 6px 0 var(--accent-green-shadow); margin-top: 10px; }
        .btn-start:active { transform: translateY(6px); box-shadow: 0 0 0 var(--accent-green-shadow); }
        .btn-secondary { background: #3c526d; box-shadow: 0 6px 0 #2a3b4f; margin-top: 10px; font-size: 15px; padding: 14px; }
        .btn-secondary:active { transform: translateY(6px); box-shadow: 0 0 0 #2a3b4f; }
        
        .btn-helper-toggle { background: var(--accent-blue); box-shadow: 0 4px 0 #1485bc; font-size: 13px; font-weight: 900; padding: 6px 14px; border-radius: 12px; border: none; color: white; cursor: pointer; }
        .btn-helper-toggle:active { transform: translateY(3px); box-shadow: 0 0 0 #1485bc; }
        .btn-input-toggle { background: #2c3e50; border: 2px solid #4a627a; font-size: 13px; font-weight: 800; padding: 8px 16px; border-radius: 14px; color: #a1b4c7; cursor: pointer; margin-bottom: 10px; transition: all 0.1s; }
        .btn-input-toggle:active { background: #1a2634; transform: translateY(2px); }

        #error-box { color: var(--accent-red); background: rgba(255,75,75,0.1); padding: 10px; margin-top: 15px; border-radius: 12px; font-size: 14px; display: none; font-weight: bold;}

        .game-header { width: 100%; max-width: 500px; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
        .progress-bar-container { flex: 1; height: 20px; background: #1a2634; border-radius: 12px; overflow: hidden; border: 3px solid #324a64; position: relative; }
        .progress-fill { height: 100%; background: var(--accent-green); width: 100%; border-radius: 8px; transition: width 1s linear, background-color 0.5s; }
        .score-counter { font-size: 18px; font-weight: 900; color: var(--accent-gold); display: flex; align-items: center; gap: 6px; }
        .timer-badge { font-size: 14px; font-weight: 800; color: var(--accent-blue); text-align: center; margin-bottom: 2px; }

        .helper-modal { width: 100%; max-width: 500px; background: #ffffff; border-radius: 16px; padding: 8px 4px; margin-bottom: 8px; display: none; box-shadow: 0 6px 20px rgba(0,0,0,0.4); border: 3px solid var(--accent-blue); box-sizing: border-box; min-height: 120px; }
        .helper-modal.show { display: block; }
        .helper-modal h3 { margin: 0 0 6px 0; font-size: 13px; color: #1a2634; text-align: center; font-weight: 900; }
        .helper-container { display: flex; justify-content: center; align-items: center; gap: 5px; width: 100%; background: #fafbfc; border-radius: 8px; min-height: 90px; padding-top: 5px; }

        .card-wrapper { width: 100%; max-width: 500px; background: #ffffff; border-radius: 20px; padding: 10px 8px; display: flex; justify-content: center; align-items: center; min-height: 140px; position: relative; box-shadow: 0 8px 25px rgba(0,0,0,0.4); border: 4px solid #e0e6ed; margin-bottom: 8px; box-sizing: border-box; }
        .fade-out svg { opacity: 0; transition: opacity 0.8s ease-in-out; }
        .fade-in svg { opacity: 1; transition: opacity 0.2s ease-in-out; }
        #score-canvas { width: 100%; display: flex; justify-content: center; }
        #score-canvas svg { width: 100%; height: 100%; max-height: 120px; }

        .inputs-row { display: flex; width: 100%; max-width: 500px; justify-content: center; gap: 10px; margin-bottom: 6px; }
        .input-cell input { width: 44px; height: 46px; text-align: center; font-size: 24px; font-weight: 900; text-transform: uppercase; border: 3px solid #324a64; border-radius: 14px; background: var(--bg-panel); color: white; transition: all 0.15s; box-shadow: 0 4px 0 rgba(0,0,0,0.3); }
        .input-cell input.active-box { border-color: var(--accent-blue); background: rgba(28, 176, 246, 0.2); transform: scale(1.08); box-shadow: 0 0 15px rgba(28, 176, 246, 0.5); }
        .input-cell input.correct { background-color: var(--accent-green); border-color: var(--accent-green-shadow); color: white; animation: pop 0.3s ease-out; }
        .input-cell input.incorrect { background-color: var(--accent-red); border-color: var(--accent-red-shadow); color: white; animation: shake 0.4s; }

        .piano-wrapper { position: relative; width: 100%; max-width: 460px; height: 150px; margin: 0 auto; display: flex; box-shadow: 0 8px 25px rgba(0,0,0,0.5); border-radius: 8px 8px 14px 14px; border: 4px solid #324a64; background: #1a2634; overflow: hidden; box-sizing: border-box; }
        .white-key { flex: 1; background: #ffffff; border-right: 2px solid #d0d9e2; border-bottom: 6px solid #b5c2d1; position: relative; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 12px; font-size: 20px; font-weight: 900; color: #1a2634; transition: all 0.05s ease-out; touch-action: manipulation; user-select: none; }
        .white-key:last-child { border-right: none; }
        .white-key:active, .white-key.simulated-active { background: #e6ecef; border-bottom-width: 2px; transform: translateY(4px); }
        .black-key { position: absolute; width: 8.5%; height: 60%; background: linear-gradient(to bottom, #4a5c6f, #1a2634); border-radius: 0 0 6px 6px; z-index: 2; pointer-events: none; top: 0; transform: translateX(-50%); box-shadow: 2px 2px 5px rgba(0,0,0,0.4); border-bottom: 3px solid #0d151e; }

        .wheel-container { position: relative; width: 240px; height: 240px; margin: 0 auto; background: radial-gradient(circle, rgba(36,52,71,0.8) 0%, rgba(26,38,52,0.95) 100%); border-radius: 50%; border: 4px solid #324a64; box-shadow: 0 8px 25px rgba(0,0,0,0.5); display: none; }
        .wheel-btn { position: absolute; width: 50px; height: 50px; border-radius: 50%; border: none; font-size: 20px; font-weight: 900; color: #1a2634; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 0 rgba(0,0,0,0.4); transition: transform 0.08s; touch-action: manipulation; z-index: 25; }
        .wheel-btn:active, .wheel-btn.simulated-active { transform: scale(0.92) translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.4); }

        #btn-A { background: #ff4b4b; color: white; } #btn-B { background: #ff9600; color: white; } #btn-C { background: #ffc800; color: #1a2634; } #btn-D { background: #58cc02; color: white; } #btn-E { background: #1cb0f6; color: white; } #btn-F { background: #ce82ff; color: white; } #btn-G { background: #ff80bf; color: white; } 

        .summary-card { background: var(--bg-panel); padding: 35px; border-radius: 24px; width: 100%; max-width: 440px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 3px solid #324a64; z-index: 20; position: relative; }
        .summary-card h2 { color: var(--accent-gold); font-size: 36px; margin: 0 0 10px 0; }
        .summary-stat { font-size: 18px; margin-bottom: 15px; color: var(--text-muted); }
        .medal-display { font-size: 40px; margin: 10px 0; }

        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    </style>
</head>
<body>

<div id="screen-setup" class="screen active">
    <div class="setup-card">
        <h1>🎵 Note Quest</h1>
        <p>60-Second Challenge</p>
        
        <select id="clef-select" onchange="renderHelperSheetGraphics()">
            <option value="treble">Treble Clef</option>
            <option value="bass">Bass Clef</option>
            <option value="alto">Alto Clef</option>
            <option value="tenor">Tenor Clef</option>
        </select>
        
        <select id="level-select">
            <option value="1" selected>Level 1: Whole Notes (Single)</option>
            <option value="2">Level 2: Rhythms (Progressive 2 to 4 Notes)</option>
        </select>
        
        <select id="memory-mode">
            <option value="visible">Mode: Always Visible (Learning Mode)</option>
            <option value="fade-5">Mode: Memory (5s Fade)</option>
            <option value="fade-2">Mode: Blitz (2s Fade)</option>
        </select>
        
        <button class="btn btn-start" id="start-btn" onclick="startGame()">Start 60s Round</button>
        <div id="error-box"></div>
    </div>
</div>

<div id="screen-game" class="screen">
    <div class="game-header">
        <div class="progress-bar-container"><div class="progress-fill" id="progress-bar"></div></div>
        <button class="btn-helper-toggle" id="helper-toggle-btn" onclick="toggleHelperModal()">💡 Helper Sheet</button>
        <div class="score-counter">⭐ <span id="score-text">0</span></div>
    </div>
    <div class="timer-badge" id="timer-badge">60s remaining</div>
    
    <div class="helper-modal" id="helper-sheet-modal">
        <h3>📖 Note Name Helpers (Lines & Spaces)</h3>
        <div class="helper-container">
            <div id="helper-lines-canvas"></div>
            <div id="helper-spaces-canvas"></div>
        </div>
    </div>

    <div class="card-wrapper fade-in" id="card-canvas-wrapper">
        <div id="score-canvas"></div>
    </div>
    
    <button class="btn-input-toggle" id="input-toggle-btn" onclick="toggleInputMethod()">🔄 Switch to Circle Keypad</button>

    <div class="inputs-row" id="inputs-container"></div>

    <div class="piano-wrapper" id="piano-container">
        <div class="white-key" id="key-C1" onclick="handleKeypadInput('C')">C</div>
        <div class="black-key" style="left: 12.5%"></div>
        <div class="white-key" id="key-D" onclick="handleKeypadInput('D')">D</div>
        <div class="black-key" style="left: 25%"></div>
        <div class="white-key" id="key-E" onclick="handleKeypadInput('E')">E</div>
        <div class="white-key" id="key-F" onclick="handleKeypadInput('F')">F</div>
        <div class="black-key" style="left: 50%"></div>
        <div class="white-key" id="key-G" onclick="handleKeypadInput('G')">G</div>
        <div class="black-key" style="left: 62.5%"></div>
        <div class="white-key" id="key-A" onclick="handleKeypadInput('A')">A</div>
        <div class="black-key" style="left: 75%"></div>
        <div class="white-key" id="key-B" onclick="handleKeypadInput('B')">B</div>
        <div class="white-key" id="key-C2" onclick="handleKeypadInput('C')">C</div>
    </div>

    <div class="wheel-container" id="wheel-container">
        <button class="wheel-btn" id="btn-A" onclick="handleKeypadInput('A')">A</button>
        <button class="wheel-btn" id="btn-B" onclick="handleKeypadInput('B')">B</button>
        <button class="wheel-btn" id="btn-C" onclick="handleKeypadInput('C')">C</button>
        <button class="wheel-btn" id="btn-D" onclick="handleKeypadInput('D')">D</button>
        <button class="wheel-btn" id="btn-E" onclick="handleKeypadInput('E')">E</button>
        <button class="wheel-btn" id="btn-F" onclick="handleKeypadInput('F')">F</button>
        <button class="wheel-btn" id="btn-G" onclick="handleKeypadInput('G')">G</button>
    </div>
</div>

<div id="screen-summary" class="screen">
    <div class="summary-card">
        <h2>🎉 Time's Up!</h2>
        <div class="medal-display" id="final-medal">🥉</div>
        <div class="summary-stat">Total Score: <span id="final-score" style="color:var(--accent-gold); font-weight:900; font-size:28px;">0</span></div>
        <div class="summary-stat">Accuracy: <span id="final-accuracy" style="color:white; font-weight:bold;">100%</span></div>
        <button class="btn btn-start" id="restart-btn" onclick="startGame()">Play Again 🚀</button>
        <button class="btn btn-secondary" id="setup-btn" onclick="switchScreen('screen-setup')">Change Settings</button>
    </div>
</div>

<script>
    let isPianoInput = true;
    let activeErrorsQueue = []; 
    let isTestingErrorNote = false;
    let currentFlashcardPitch = null; // e.g. "b/4"

    // Listen for computer keyboard strokes
    window.addEventListener('keydown', (e) => {
        const key = e.key.toUpperCase();
        if (['A','B','C','D','E','F','G'].includes(key)) {
            // Visual feedback simulation
            if (isPianoInput) {
                const pKey = document.getElementById(key === 'C' ? 'key-C1' : `key-${key}`);
                if (pKey) { pKey.classList.add('simulated-active'); setTimeout(() => pKey.classList.remove('simulated-active'), 100); }
            } else {
                const cKey = document.getElementById(`btn-${key}`);
                if (cKey) { cKey.classList.add('simulated-active'); setTimeout(() => cKey.classList.remove('simulated-active'), 100); }
            }
            handleKeypadInput(key);
        }
    });

    function toggleInputMethod() {
        isPianoInput = !isPianoInput;
        const piano = document.getElementById('piano-container');
        const wheel = document.getElementById('wheel-container');
        const btn = document.getElementById('input-toggle-btn');
        if (isPianoInput) { piano.style.display = 'flex'; wheel.style.display = 'none'; btn.innerText = '🔄 Switch to Circle Keypad';
        } else { piano.style.display = 'none'; wheel.style.display = 'block'; btn.innerText = '🔄 Switch to Piano Keyboard'; positionWheelButtons(); }
    }

    function positionWheelButtons() {
        const buttons = document.querySelectorAll('.wheel-btn');
        const total = buttons.length; const radius = 85; const centerX = 120; const centerY = 120; const btnSize = 50;
        buttons.forEach((btn, index) => {
            const angle = (index * 2 * Math.PI) / total - Math.PI / 2;
            btn.style.left = `${centerX + radius * Math.cos(angle) - btnSize / 2}px`;
            btn.style.top = `${centerY + radius * Math.sin(angle) - btnSize / 2}px`;
        });
    }

    window.addEventListener('DOMContentLoaded', positionWheelButtons);

    function toggleHelperModal() {
        const modal = document.getElementById('helper-sheet-modal');
        if(modal) { modal.classList.toggle('show'); if(modal.classList.contains('show')) setTimeout(renderHelperSheetGraphics, 50); }
    }

    function applyBottomAnnotation(text) {
        const VF = Vex.Flow; const anno = new VF.Annotation(text); anno.setVerticalJustification(3); return anno;
    }

    function renderHelperSheetGraphics() {
        try {
            const VF = Vex.Flow; const clefSelect = document.getElementById('clef-select'); const currentClef = clefSelect ? clefSelect.value : 'treble';
            const HELPER_CONFIGS = {
                "treble": { lines: { keys: ['e/4', 'g/4', 'b/4', 'd/5', 'f/5'], texts: ['Every', 'Good', 'Boy', 'Deserves', 'Fruit'] }, spaces: { keys: ['f/4', 'a/4', 'c/5', 'e/5'], texts: ['F', 'A', 'C', 'E'] } },
                "bass": { lines: { keys: ['g/2', 'b/2', 'd/3', 'f/3', 'a/3'], texts: ['Good', 'Boys', 'Deserve', 'Fruit', 'Always'] }, spaces: { keys: ['a/2', 'c/3', 'e/3', 'g/3'], texts: ['All', 'Cows', 'Eat', 'Grass'] } },
                "alto": { lines: { keys: ['f/3', 'a/3', 'c/4', 'e/4', 'g/4'], texts: ['Frogs', 'And', 'Cats', 'Eat', 'Grass'] }, spaces: { keys: ['g/3', 'b/3', 'd/4', 'f/4'], texts: ['Good', 'Boys', 'Deserve', 'Fruit'] } },
                "tenor": { lines: { keys: ['d/3', 'f/3', 'a/3', 'c/4', 'e/4'], texts: ['Dogs', 'Face', 'All', 'Cats', 'Everywhere'] }, spaces: { keys: ['e/3', 'g/3', 'b/3', 'd/4'], texts: ['Every', 'Good', 'Boy', 'Deserves'] } }
            };
            const config = HELPER_CONFIGS[currentClef];
            
            const linesDiv = document.getElementById('helper-lines-canvas');
            if (linesDiv) {
                linesDiv.innerHTML = ''; const renLines = new VF.Renderer(linesDiv, VF.Renderer.Backends.SVG); renLines.resize(250, 100);
                const ctxLines = renLines.getContext(); ctxLines.scale(0.68, 0.68); 
                const stave1 = new VF.Stave(0, 5, 360).addClef(currentClef).setContext(ctxLines).draw();
                const lineNotes = config.lines.keys.map((key, i) => new VF.StaveNote({ clef: currentClef, keys: [key], duration: 'q', stem_direction: 1 }).addAnnotation(0, applyBottomAnnotation(config.lines.texts[i])));
                VF.Formatter.FormatAndDraw(ctxLines, stave1, lineNotes);
            }

            const spacesDiv = document.getElementById('helper-spaces-canvas');
            if (spacesDiv) {
                spacesDiv.innerHTML = ''; const renSpaces = new VF.Renderer(spacesDiv, VF.Renderer.Backends.SVG); renSpaces.resize(190, 100);
                const ctxSpaces = renSpaces.getContext(); ctxSpaces.scale(0.68, 0.68);
                const stave2 = new VF.Stave(0, 5, 275).addClef(currentClef).setContext(ctxSpaces).draw();
                const spaceNotes = config.spaces.keys.map((key, i) => new VF.StaveNote({ clef: currentClef, keys: [key], duration: 'q', stem_direction: 1 }).addAnnotation(0, applyBottomAnnotation(config.spaces.texts[i])));
                VF.Formatter.FormatAndDraw(ctxSpaces, stave2, spaceNotes);
            }
        } catch(e) {}
    }

    let audioCtx = null;
    function initAudio() {
        try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {}
    }
    function playSound(type) {
        if (!audioCtx) return;
        try {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain(); osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            if (type === 'correct') { osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.15); gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }
            else if (type === 'wrong') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.2); gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2); osc.start(); osc.stop(audioCtx.currentTime + 0.2); }
            else if (type === 'timeout') { osc.type = 'square'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.4); gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4); osc.start(); osc.stop(audioCtx.currentTime + 0.4); }
            else if (type === 'complete') { osc.type = 'triangle'; osc.frequency.setValueAtTime(440, audioCtx.currentTime); osc.frequency.setValueAtTime(554, audioCtx.currentTime + 0.15); osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.3); osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.45); gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.9); osc.start(); osc.stop(audioCtx.currentTime + 0.9); }
        } catch (e) {}
    }

    const CLEF_CONFIGS = {
        "treble": { clef: "treble", lines: [["E","e/4"],["G","g/4"],["B","b/4"],["D","d/5"],["F","f/5"]], spaces: [["F","f/4"],["A","a/4"],["C","c/5"],["E","e/5"]] },
        "bass":   { clef: "bass",   lines: [["G","g/2"],["B","b/2"],["D","d/3"],["F","f/3"],["A","a/3"]], spaces: [["A","a/2"],["C","c/3"],["E","e/3"],["G","g/3"]] },
        "alto":   { clef: "alto",   lines: [["F","f/3"],["A","a/3"],["C","c/4"],["E","e/4"],["G","g/4"]] , spaces: [["G","g/3"],["B","b/3"],["D","d/4"],["F","f/4"]] },
        "tenor":  { clef: "tenor",  lines: [["D","d/3"],["F","f/3"],["A","a/3"],["C","c/4"],["E","e/4"]], spaces: [["E","e/3"],["G","g/3"],["B","b/3"],["D","d/4"]] }
    };

    let gameTimer = null; let secondsLeft = 60; let score = 0; let totalAttempts = 0; let correctAttempts = 0;
    let currentExpectedNotes = []; let activeInputIndex = 0; let fadeTimer = null; let breakOutTimer = null;

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        const targetScreen = document.getElementById(screenId);
        if(targetScreen) targetScreen.classList.add('active');
        if (screenId === 'screen-game') setTimeout(positionWheelButtons, 50);
    }

    function startGame() {
        initAudio(); score = 0; totalAttempts = 0; correctAttempts = 0; secondsLeft = 60; activeErrorsQueue = [];
        document.getElementById('score-text').innerText = score;
        switchScreen('screen-game'); start60SecondTimer(); loadNextCard();
    }

    function start60SecondTimer() {
        if (gameTimer) clearInterval(gameTimer);
        const fillBar = document.getElementById('progress-bar');
        if(fillBar) { fillBar.style.width = '100%'; fillBar.style.backgroundColor = 'var(--accent-green)'; }

        gameTimer = setInterval(() => {
            secondsLeft--;
            document.getElementById('timer-badge').innerText = `${secondsLeft}s remaining`;
            if(fillBar) fillBar.style.width = `${(secondsLeft / 60) * 100}%`;
            if (secondsLeft <= 20 && secondsLeft > 10) fillBar.style.backgroundColor = '#ffc800'; 
            else if (secondsLeft <= 10) fillBar.style.backgroundColor = 'var(--accent-red)'; 
            if (secondsLeft <= 0) { clearInterval(gameTimer); finishRound(); }
        }, 1000);
    }

    function loadNextCard() {
        if (secondsLeft <= 0) return;
        if (fadeTimer) clearTimeout(fadeTimer); if (breakOutTimer) clearTimeout(breakOutTimer);
        document.getElementById('card-canvas-wrapper').className = 'card-wrapper fade-in';
        generateFlashcard();
    }

    function generateFlashcard() {
        try {
            const VF = Vex.Flow;
            const canvasContainer = document.getElementById('score-canvas'); canvasContainer.innerHTML = '';
            const inputsContainer = document.getElementById('inputs-container'); inputsContainer.innerHTML = '';
            
            const level = document.getElementById('level-select').value;
            const config = CLEF_CONFIGS[document.getElementById('clef-select').value];
            const combinedPool = [...config.lines, ...config.spaces];

            const renderer = new VF.Renderer(canvasContainer, VF.Renderer.Backends.SVG); 
            renderer.resize(320, 130);
            const context = renderer.getContext(); context.scale(1.3, 1.3);

            const stave = new VF.Stave(8, 5, 225);
            stave.addClef(config.clef);
            
            if(level === '1') { 
                stave.options.left_bar = false; // Ditch the left barline for Level 1
                stave.setNoteStartX(115); 
            } else {
                stave.addTimeSignature("4/4");
            }
            stave.setContext(context).draw();

            currentExpectedNotes = []; let staveNotes = []; 

            if (level === '1') {
                let chosenNote;
                // SRS Error Interleave Logic
                if (activeErrorsQueue.length > 0 && !isTestingErrorNote) {
                    chosenNote = [activeErrorsQueue[0].letter, activeErrorsQueue[0].pitch];
                    isTestingErrorNote = true;
                } else {
                    chosenNote = combinedPool[Math.floor(Math.random() * combinedPool.length)];
                    isTestingErrorNote = false;
                }
                
                currentFlashcardPitch = chosenNote[1];
                staveNotes.push(new VF.StaveNote({ clef: config.clef, keys: [chosenNote[1]], duration: "w" })); 
                currentExpectedNotes.push(chosenNote[0]);
            } else {
                // Multi-note logic remains unmodified for this test
                let durations = ["q", "q", "q", "q"];
                for (let dur of durations) {
                    let chosen = combinedPool[Math.floor(Math.random() * combinedPool.length)]; 
                    staveNotes.push(new VF.StaveNote({ clef: config.clef, keys: [chosen[1]], duration: dur })); 
                    currentExpectedNotes.push(chosen[0]);
                }
            }

            let voice = new VF.Voice({ num_beats: 4, beat_value: 4 }).addTickables(staveNotes);
            new VF.Formatter().joinVoices([voice]).format([voice], level === '1' ? 40 : 165);
            voice.draw(context, stave);

            currentExpectedNotes.forEach((_, idx) => {
                const cell = document.createElement('div'); cell.className = 'input-cell';
                const input = document.createElement('input'); input.type = 'text'; input.readOnly = true; input.id = `box-${idx}`;
                cell.appendChild(input); inputsContainer.appendChild(cell);
            });
            activeInputIndex = 0; setActiveBox(0);

            const mode = document.getElementById('memory-mode').value;
            if (mode === 'fade-5') startFadeCountdown(5, 4); 
            else if (mode === 'fade-2') startFadeCountdown(2, 4); 
        } catch (err) { console.error(err); }
    }

    function startFadeCountdown(fadeSecs, breakOutSecs) {
        fadeTimer = setTimeout(() => {
            document.getElementById('card-canvas-wrapper').className = 'card-wrapper fade-out';
            breakOutTimer = setTimeout(() => {
                if (secondsLeft > 0) {
                    playSound('timeout');
                    setTimeout(loadNextCard, 800);
                }
            }, breakOutSecs * 1000);
        }, fadeSecs * 1000);
    }

    function setActiveBox(idx) {
        document.querySelectorAll('.input-cell input').forEach(inp => inp.classList.remove('active-box'));
        const target = document.getElementById(`box-${idx}`);
        if (target) { activeInputIndex = idx; target.classList.add('active-box'); }
    }

    function handleKeypadInput(letter) {
        if (secondsLeft <= 0) return;
        const input = document.getElementById(`box-${activeInputIndex}`);
        if (!input) return;

        input.value = letter;
        const correctVal = currentExpectedNotes[activeInputIndex].toUpperCase();
        totalAttempts++;

        if (letter === correctVal) {
            playSound('correct');
            input.classList.remove('incorrect'); input.classList.add('correct');
            correctAttempts++;

            // SRS Logic: Decrement error attempts if we were testing an error
            if (isTestingErrorNote && document.getElementById('level-select').value === '1') {
                activeErrorsQueue[0].remaining--;
                if (activeErrorsQueue[0].remaining <= 0) activeErrorsQueue.shift(); 
            }

            if (activeInputIndex < currentExpectedNotes.length - 1) { 
                setActiveBox(activeInputIndex + 1); 
            } else { 
                score++; document.getElementById('score-text').innerText = score;
                if (fadeTimer) clearTimeout(fadeTimer); if (breakOutTimer) clearTimeout(breakOutTimer);
                setTimeout(loadNextCard, 300); 
            }
        } else {
            playSound('wrong');
            
            // SRS Logic: Register the error
            if (document.getElementById('level-select').value === '1') {
                let existingErr = activeErrorsQueue.find(e => e.pitch === currentFlashcardPitch);
                if (!existingErr) activeErrorsQueue.push({ pitch: currentFlashcardPitch, letter: correctVal, remaining: 3 });
                else existingErr.remaining = 3; // Reset requirement to 3 correct if they fumble again
            }

            input.classList.remove('correct'); input.classList.remove('incorrect'); 
            void input.offsetWidth; input.classList.add('incorrect');
            setTimeout(() => { input.value = ''; input.classList.remove('incorrect'); }, 300);
        }
    }

    function finishRound() {
        if (fadeTimer) clearTimeout(fadeTimer); if (breakOutTimer) clearTimeout(breakOutTimer);
        playSound('complete'); switchScreen('screen-summary');
        
        let accuracy = totalAttempts === 0 ? 0 : Math.round((correctAttempts / totalAttempts) * 100);
        document.getElementById('final-score').innerText = score;
        document.getElementById('final-accuracy').innerText = `${accuracy}%`;

        let medal = 'Bronze 🥉'; // Standard passing
        if (accuracy >= 95 && score >= 20) medal = 'Gold 🥇'; // High speed, high accuracy
        else if (accuracy >= 85 && score >= 12) medal = 'Silver 🥈'; 
        
        document.getElementById('final-medal').innerText = medal;
    }
</script>
